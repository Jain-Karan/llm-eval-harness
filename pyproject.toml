[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "Per-tenant evaluation harness for RAG/LLM apps: golden sets, faithfulness, retrieval recall, correctness, LLM-as-judge, guardrails, cost tracking, Langfuse tracing and a CI release gate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Karan Jain" }]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "langchain-core>=0.3",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3"]
langfuse = ["langfuse>=3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "langfuse>=3"]

[project.scripts]
evalh = "evalharness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evalharness = ["prompts/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
